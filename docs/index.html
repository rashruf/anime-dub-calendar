<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime dub calendar</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989d; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; }
  a.cal { display:flex; align-items:center; gap:12px; background:var(--card); color:var(--text); text-decoration:none;
          padding:14px 16px; border-radius:12px; margin-bottom:10px; font-weight:600; }
  a.cal span.dot { width:14px; height:14px; border-radius:50%; flex:none; }
  a.cal span.go { margin-left:auto; color:var(--muted); font-weight:400; font-size:15px; }
  footer { margin-top:24px; font-size:14px; color:var(--muted); }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Anime dub agenda's</h1>
  <p>Tik op een agenda op je iPhone en kies <b>Abonneer</b>.</p>

  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/crunchyroll.ics"><span class="dot" style="background:#E5262B"></span>Crunchyroll<span class="go">Abonneer</span></a>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/netflix.ics"><span class="dot" style="background:#1C1C1E;outline:1px solid #888"></span>Netflix<span class="go">Abonneer</span></a>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/hidive.ics"><span class="dot" style="background:#AF52DE"></span>HIDIVE<span class="go">Abonneer</span></a>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/prime-video.ics"><span class="dot" style="background:#34C759"></span>Prime Video<span class="go">Abonneer</span></a>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/disney.ics"><span class="dot" style="background:#007AFF"></span>Disney+<span class="go">Abonneer</span></a>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/oceanveil.ics"><span class="dot" style="background:#30B0C7"></span>OceanVeil<span class="go">Abonneer</span></a>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/overig.ics"><span class="dot" style="background:#8E8E93"></span>Overig<span class="go">Abonneer</span></a>

  <p style="margin-top:20px">Of alles in één agenda:</p>
  <a class="cal" href="webcal://rashruf.github.io/anime-dub-calendar/anime-dubs.ics"><span class="dot" style="background:linear-gradient(135deg,#E5262B,#007AFF)"></span>Alle dubs<span class="go">Abonneer</span></a>

  <footer>Schema-data: <a href="https://animeschedule.net">AnimeSchedule.net</a> · elk uur bijgewerkt</footer>
</main>
</body>
</html>
